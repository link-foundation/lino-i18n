<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Links Notation · React translation</title>
    <style>
      body {
        margin: 0;
        background: #f4f5f0;
        color: #183d35;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 680px;
        margin: 60px auto;
        padding: 40px;
        background: white;
        border-radius: 20px;
      }
      .eyebrow {
        color: #697b73;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 38px;
        line-height: 1.2;
        margin: 12px 0 32px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        border: 1px solid #bbc7bd;
        border-radius: 8px;
        padding: 8px 14px;
        background: white;
        color: inherit;
      }
      button {
        background: #183d35;
        color: white;
        cursor: pointer;
      }
      .receipt {
        padding: 24px;
        margin: 28px 0;
        background: #eff5ee;
        border-radius: 12px;
      }
      .receipt p {
        margin: 8px 0;
      }
      a {
        color: #176447;
      }
      @media (max-width: 760px) {
        main {
          margin: 20px;
          padding: 24px;
        }
        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
