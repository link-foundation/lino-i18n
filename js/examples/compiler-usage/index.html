<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lino automatic translation example</title>
    <style>
      body {
        margin: 0;
        background: #edf1f5;
        color: #142333;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 700px;
        margin: 70px auto;
        padding: 44px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 15px 40px #14233312;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }
      .label {
        color: #53677a;
        font-size: 12px;
        letter-spacing: 2px;
      }
      h1 {
        font-size: 36px;
        line-height: 1.2;
      }
      input,
      select,
      button {
        font: inherit;
        border-radius: 8px;
        padding: 10px 14px;
        border: 1px solid #c1cddb;
      }
      input {
        width: 90%;
      }
      section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 32px;
        padding-top: 20px;
        border-top: 1px solid #edf1f5;
      }
      button {
        background: #214ed3;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
