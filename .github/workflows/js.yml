name: JavaScript
'on':
  push:
    branches:
      - main
    paths:
      - js/**
      - docs/**
      - scripts/**
      - experiments/issue-23-*
      - README.md
      - .github/**
      - .githooks/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - js/**
      - docs/**
      - scripts/**
      - experiments/issue-23-*
      - README.md
      - .github/**
      - .githooks/**
  workflow_dispatch:
    inputs:
      release_mode:
        description: Manual release mode
        required: true
        type: choice
        default: instant
        options:
          - instant
          - changeset-pr
      bump_type:
        description: Manual release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      description:
        description: Manual release description
        required: false
        type: string
permissions:
  contents: read
env:
  NODE_VERSION: 24.x
  NPM_CONFIG_PROVENANCE: 'true'
  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GITHUB_BEFORE_SHA: ${{ github.event.before }}
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && github.event_name != 'workflow_dispatch'
    outputs:
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      js-changed: ${{ steps.changes.outputs.js-changed }}
      package-changed: ${{ steps.changes.outputs.package-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Detect JavaScript changes
        id: changes
        run: node js/scripts/detect-code-changes.mjs
    concurrency:
      group: check-js-${{ github.ref }}-detect-changes-
      cancel-in-progress: true
    needs:
      - release-preflight
  test-compilation:
    name: Test Compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - detect-changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash scripts/check-mjs-syntax.sh
    concurrency:
      group: check-js-${{ github.ref }}-test-compilation-
      cancel-in-progress: true
  check-file-line-limits:
    name: Check File Line Limits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - detect-changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - run: bash scripts/check-file-line-limits.sh
    concurrency:
      group: check-js-${{ github.ref }}-check-file-line-limits-
      cancel-in-progress: true
  version-check:
    name: Check for Manual Version Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check package version
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version.mjs
    concurrency:
      group: check-js-${{ github.ref }}-version-check-
      cancel-in-progress: true
  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Validate changeset
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-changeset.mjs
    concurrency:
      group: check-js-${{ github.ref }}-changeset-check-
      cancel-in-progress: true
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - detect-changes
      - test-compilation
      - version-check
      - changeset-check
      - check-file-line-limits
      - release-preflight
    if: |
      always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.package-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:duplication
      - name: Check for secrets
        run: npm run lint:secrets
      - run: npm audit --package-lock-only --audit-level=high
      - run: node --test --test-timeout=30000 ../scripts/crates-publish-preflight.test.mjs && python3 ../experiments/issue-23-shared-guards.py
    concurrency:
      group: check-js-${{ github.ref }}-lint-
      cancel-in-progress: true
  test:
    name: Test (${{ matrix.runtime }}${{ matrix.runtime == 'node' && format(' {0}', matrix.node) || '' }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs:
      - detect-changes
      - changeset-check
      - test-compilation
      - lint
      - check-file-line-limits
    if: always() && !cancelled() && needs.lint.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        runtime:
          - node
          - bun
          - deno
        # Node 24 is the active LTS used everywhere else; the extra legs cover
        # the `engines` floor (22.x) and the newest release line (26.x).
        node:
          - 24.x
        include:
          - os: ubuntu-24.04
            runtime: node
            node: 22.x
          - os: ubuntu-24.04
            runtime: node
            node: 26.x
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install dependencies (Node.js)
        if: matrix.runtime == 'node'
        run: npm ci
      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm test
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: npm ci
      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun test --timeout 30000
      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.6
      - name: Install dependencies (Deno)
        if: matrix.runtime == 'deno'
        run: npm ci
      - name: Run tests (Deno)
        if: matrix.runtime == 'deno'
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-run
    concurrency:
      group: check-js-${{ github.ref }}-test-${{ matrix.os }}-${{ matrix.runtime }}-${{ matrix.node }}
      cancel-in-progress: true
  browser-test:
    name: Browser Test (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - lint
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:types
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: js/test-results/
    concurrency:
      group: check-js-${{ github.ref }}-browser-test-
      cancel-in-progress: true
  cli-smoke-test:
    name: CLI Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - lint
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: node bin/lino-i18n.js --help
      - name: Convert sample i18next JSON to lino
        run: |
          mkdir -p /tmp/sample/in /tmp/sample/out
          cat > /tmp/sample/in/en.json <<'JSON'
          {"greeting": "Hello, {{name}}!", "items": {"one": "{{count}} item", "other": "{{count}} items"}}
          JSON
          node bin/lino-i18n.js convert --from i18next --in /tmp/sample/in/en.json --out /tmp/sample/out --locale en
          cat /tmp/sample/out/en.lino
    concurrency:
      group: check-js-${{ github.ref }}-cli-smoke-test-
      cancel-in-progress: true
  package:
    name: Package Dry Run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - test
      - cli-smoke-test
      - browser-test
    if: |
      always() && !cancelled() &&
      needs.test.result == 'success' &&
      needs.cli-smoke-test.result == 'success' &&
      needs.browser-test.result == 'success'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the latest merge with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash ../scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm pack --dry-run
    concurrency:
      group: check-js-${{ github.ref }}-package-
      cancel-in-progress: true
  auto-release:
    name: Publish npm Package and GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs:
      - package
      - release-preflight
    if: |-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.package.result == 'success' && needs.release-preflight.result == 'success'
    defaults:
      run:
        working-directory: js
    environment:
      name: npm
      url: https://www.npmjs.com/package/lino-i18n
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Update npm for OIDC trusted publishing
        run: node scripts/setup-npm.mjs
      - name: Synchronize only validated release metadata
        run: node scripts/version-and-commit.mjs --mode sync
      - name: Check pending changesets
        id: check_changesets
        run: node scripts/check-changesets.mjs
      - name: Check whether release is needed
        id: check_release
        env:
          HAS_CHANGESETS: ${{ steps.check_changesets.outputs.has_changesets }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: js-v
        run: node scripts/check-release-needed.mjs
      - name: Check publish credentials before versioning
        run: bash ../scripts/preflight-publish.sh npm
        if: steps.check_release.outputs.should_release == 'true'
      - name: Version and commit
        if: steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump != 'true'
        run: node scripts/version-and-commit.mjs --mode changeset
      - name: Publish to npm
        if: steps.check_release.outputs.should_release == 'true'
        id: publish
        run: node scripts/publish-to-npm.mjs
      - name: Create GitHub release
        if: steps.check_release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/create-github-release.mjs --release-version "${PUBLISHED_VERSION}" --repository "${REPOSITORY}" --tag-prefix js-v --language
          JavaScript
    permissions:
      # Push release metadata or create the manual release PR.
      contents: write # Push validated release metadata and tags or create the release PR.
      # Request npm provenance/trusted publishing or Pages deployment identity.
      id-token: write # Obtain the job-scoped npm or Pages OIDC token.
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
      queue: max
  manual-release:
    name: Manual npm Release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: always() && !cancelled() && needs.package.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
      && inputs.release_mode == 'instant' && needs.release-preflight.result == 'success'
    defaults:
      run:
        working-directory: js
    environment:
      name: npm
      url: https://www.npmjs.com/package/lino-i18n
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Update npm for OIDC trusted publishing
        run: node scripts/setup-npm.mjs
      - name: Synchronize only validated release metadata
        run: node scripts/version-and-commit.mjs --mode sync
      - name: Check publish credentials before versioning
        run: bash ../scripts/preflight-publish.sh npm
      - name: Version and commit
        id: version
        run: node scripts/version-and-commit.mjs --mode instant --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"
        env:
          RELEASE_DESCRIPTION: ${{ inputs.description }}
          BUMP_TYPE: ${{ inputs.bump_type }}
      - name: Publish to npm
        id: publish
        run: node scripts/publish-to-npm.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/create-github-release.mjs --release-version "${PUBLISHED_VERSION}" --repository "${REPOSITORY}" --tag-prefix js-v --language
          JavaScript
    permissions:
      # Push release metadata or create the manual release PR.
      contents: write # Push validated release metadata and tags or create the release PR.
      # Request npm provenance/trusted publishing or Pages deployment identity.
      id-token: write # Obtain the job-scoped npm or Pages OIDC token.
    needs:
      - package
      - release-preflight
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
      queue: max
  changeset-pr:
    name: Create Manual Changeset PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Create changeset
        run: node scripts/create-manual-changeset.mjs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"
        env:
          RELEASE_DESCRIPTION: ${{ inputs.description }}
          BUMP_TYPE: ${{ inputs.bump_type }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            This PR was created by a manual workflow trigger to prepare a JavaScript release.

            - Release type: `${{ github.event.inputs.bump_type }}`
            - Description: ${{ github.event.inputs.description || 'Manual release' }}
    permissions:
      # Push release metadata or create the manual release PR.
      contents: write # Push validated release metadata and tags or create the release PR.
      pull-requests: write # Open the manual release pull request.
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
      queue: max
  deploy-docs:
    name: Deploy JavaScript Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - package
    if: |
      always() && !cancelled() &&
      needs.package.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: .
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Install rust-script
        run: cargo install rust-script --version 0.36.0 --locked
      - uses: actions/configure-pages@v6
      - run: |-
          node js/scripts/build-docs-site.mjs
          cargo doc --locked --manifest-path rust/Cargo.toml --workspace --no-deps
          rust-script rust/scripts/build-docs-site.rs
          python3 scripts/assemble-docs.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
    permissions:
      contents: read
      # Deploy the combined documentation artifact to GitHub Pages.
      pages: write # Deploy the combined JavaScript and Rust documentation site.
      # Request npm provenance/trusted publishing or Pages deployment identity.
      id-token: write # Obtain the job-scoped npm or Pages OIDC token.
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
      queue: max
  release-preflight:
    name: Release credential preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-Release credential preflight
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: bash scripts/preflight-publish.sh npm
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_mode ==
      'instant'))
    permissions:
      contents: read
      # Request npm provenance/trusted publishing or Pages deployment identity.
      id-token: write # Obtain the job-scoped npm or Pages OIDC token.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-Pipeline Status
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANCELLABLE_JOBS: '["detect-changes", "test-compilation", "check-file-line-limits", "version-check", "changeset-check", "lint", "test",
            "browser-test", "cli-smoke-test", "package", "release-preflight"]'
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/check-pipeline-status.py
    if: always()
    needs:
