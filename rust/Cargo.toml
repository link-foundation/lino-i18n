[workspace]
resolver = "3"
members = [
    "lino-i18n",
    "lino-i18n-macros",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# links-notation 0.23 (via lino-objects-codec 0.8) calls u*::is_multiple_of,
# stable since 1.87; it does not declare this itself (links-notation#334).
rust-version = "1.87"
license = "Unlicense"
repository = "https://github.com/link-foundation/lino-i18n"
homepage = "https://github.com/link-foundation/lino-i18n"
authors = ["Link Foundation"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
