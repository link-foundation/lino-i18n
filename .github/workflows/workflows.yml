name: Workflows
'on':
  push:
    branches:
      - main
    paths:
      - .github/**
      - .githooks/**
      - scripts/**
      - experiments/issue-23-*
  pull_request:
    paths:
      - .github/**
      - .githooks/**
      - scripts/**
      - experiments/issue-23-*
  workflow_dispatch: null
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          # Supported by GitHub; actionlint 1.7.12 schema lags (rhysd/actionlint#657).
          # Workflow policy validates queue values and cancellation compatibility.
          args: -color -ignore 'unexpected key "queue" for "concurrency" section'
  policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-Workflow policy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m pip install --requirement scripts/requirements-ci.txt
      - run: python3 scripts/check-ci-policy.py && python3 scripts/check-file-line-limits.py && python3 experiments/issue-23-shared-guards.py && python3 experiments/issue-23-hook.py
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.30.1 --format=github --config .github/zizmor.yml --min-confidence medium .github/workflows .github/actions
      - run: pipx run zizmor==1.30.1 --format=github --config .github/zizmor.yml --persona pedantic --min-severity high --min-confidence high .github/workflows
          .github/actions
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-Pipeline Status
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANCELLABLE_JOBS: '["actionlint", "policy", "zizmor"]'
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/check-pipeline-status.py
    if: always()
    needs:
      - actionlint
      - policy
      - zizmor
