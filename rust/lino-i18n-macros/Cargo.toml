[package]
name = "lino-i18n-macros"
description = "Compile-time macros for lino-i18n. Reads .lino translation catalogues at compile time and embeds them as a static I18n instance."
keywords = ["i18n", "macros", "links-notation", "lino", "compile-time"]
categories = ["internationalization", "localization", "development-tools::procedural-macro-helpers"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
lino-objects-codec = "0.2.1"
