name: JavaScript

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "docs/**"
      - ".github/workflows/js.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "js/**"
      - "docs/**"
      - ".github/workflows/js.yml"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Manual release mode"
        required: true
        type: choice
        default: "instant"
        options:
          - instant
          - changeset-pr
      bump_type:
        description: "Manual release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: "Manual release description"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pages: write
  pull-requests: write

concurrency:
  group: js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  NODE_VERSION: "24.x"
  NPM_CONFIG_PROVENANCE: "true"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    outputs:
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      js-changed: ${{ steps.changes.outputs.js-changed }}
      package-changed: ${{ steps.changes.outputs.package-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Detect JavaScript changes
        id: changes
        run: node js/scripts/detect-code-changes.mjs

  test-compilation:
    name: Test Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash scripts/check-mjs-syntax.sh

  check-file-line-limits:
    name: Check File Line Limits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - run: bash scripts/check-file-line-limits.sh

  version-check:
    name: Check for Manual Version Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check package version
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version.mjs

  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - name: Validate changeset
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-changeset.mjs

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.package-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:duplication
      - name: Check for secrets
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint "bin/**" "src/**" "scripts/**" "tests/**" "README.md" "CHANGELOG.md" "package.json"

  test:
    name: Test (${{ matrix.runtime }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs:
      [
        detect-changes,
        changeset-check,
        test-compilation,
        lint,
        check-file-line-limits,
      ]
    if: |
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') &&
      (needs.test-compilation.result == 'success' || needs.test-compilation.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.check-file-line-limits.result == 'success' || needs.check-file-line-limits.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [node, bun, deno]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install dependencies (Node.js)
        if: matrix.runtime == 'node'
        run: npm ci || npm install
      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm test
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        run: bun install
      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun test --timeout 30000
      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies (Deno)
        if: matrix.runtime == 'deno'
        run: deno install
      - name: Run tests (Deno)
        if: matrix.runtime == 'deno'
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-run

  cli-smoke-test:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - run: node bin/lino-i18n.js --help
      - name: Convert sample i18next JSON to lino
        run: |
          mkdir -p /tmp/sample/in /tmp/sample/out
          cat > /tmp/sample/in/en.json <<'JSON'
          {"greeting": "Hello, {{name}}!", "items": {"one": "{{count}} item", "other": "{{count}} items"}}
          JSON
          node bin/lino-i18n.js convert --from i18next --in /tmp/sample/in/en.json --out /tmp/sample/out --locale en
          cat /tmp/sample/out/en.lino

  package:
    name: Package Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, cli-smoke-test]
    if: |
      always() && !cancelled() &&
      needs.test.result == 'success' &&
      needs.cli-smoke-test.result == 'success'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - run: npm pack --dry-run

  auto-release:
    name: Publish npm Package and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [package]
    if: |
      always() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.package.result == 'success'
    defaults:
      run:
        working-directory: js
    environment:
      name: npm
      url: https://www.npmjs.com/package/lino-i18n
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - name: Check pending changesets
        id: check_changesets
        run: node scripts/check-changesets.mjs
      - name: Check whether release is needed
        id: check_release
        env:
          HAS_CHANGESETS: ${{ steps.check_changesets.outputs.has_changesets }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: js-v
        run: node scripts/check-release-needed.mjs
      - name: Merge multiple changesets
        if: steps.check_release.outputs.should_release == 'true' && steps.check_changesets.outputs.has_changesets == 'true' && steps.check_changesets.outputs.changeset_count > 1
        run: node scripts/merge-changesets.mjs
      - name: Version and commit
        if: steps.check_release.outputs.should_release == 'true' && steps.check_release.outputs.skip_bump != 'true'
        run: node scripts/version-and-commit.mjs --mode changeset
      - name: Publish to npm
        if: steps.check_release.outputs.should_release == 'true'
        id: publish
        run: node scripts/publish-to-npm.mjs --should-pull
      - name: Create GitHub release
        if: steps.check_release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --tag-prefix js-v --language JavaScript

  manual-release:
    name: Manual npm Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant'
    defaults:
      run:
        working-directory: js
    environment:
      name: npm
      url: https://www.npmjs.com/package/lino-i18n
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - name: Version and commit
        id: version
        run: node scripts/version-and-commit.mjs --mode instant --bump-type "${{ github.event.inputs.bump_type }}" --description "${{ github.event.inputs.description }}"
      - name: Publish to npm
        id: publish
        run: node scripts/publish-to-npm.mjs --should-pull
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-github-release.mjs --release-version "${{ steps.publish.outputs.published_version }}" --repository "${{ github.repository }}" --tag-prefix js-v --language JavaScript

  changeset-pr:
    name: Create Manual Changeset PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr'
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci || npm install
      - name: Create changeset
        run: node scripts/create-manual-changeset.mjs --bump-type "${{ github.event.inputs.bump_type }}" --description "${{ github.event.inputs.description }}"
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: add changeset for manual ${{ github.event.inputs.bump_type }} release"
          branch: changeset-manual-release-${{ github.run_id }}
          title: "chore: manual ${{ github.event.inputs.bump_type }} release"
          body: |
            This PR was created by a manual workflow trigger to prepare a JavaScript release.

            - Release type: `${{ github.event.inputs.bump_type }}`
            - Description: ${{ github.event.inputs.description || 'Manual release' }}

  deploy-docs:
    name: Deploy JavaScript Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [package]
    if: |
      always() && !cancelled() &&
      needs.package.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: js
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/configure-pages@v6
      - run: node scripts/build-docs-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: js/site
      - id: deployment
        uses: actions/deploy-pages@v5
